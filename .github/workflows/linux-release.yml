name: Linux release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked GUI development environment
        run: |
          python -m pip install uv==0.12.6
          uv sync --frozen --extra gui --group dev
      - name: Validate source
        run: |
          uv run ruff check conftest.py packaging src tests
          uv run mypy src
          uv run pytest -q
      - name: Build and smoke test Linux applications
        run: ./packaging/linux/build.sh
      - name: Upload Linux release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mdhelper-0.1.0-linux-x86-64
          path: |
            dist/linux/MDHelper-*-Linux-x86_64.tar.gz
            dist/linux/MDHelper-*-Linux-x86_64-GUI.tar.gz
          if-no-files-found: error
