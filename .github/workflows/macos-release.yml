name: macOS arm64 release candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    timeout-minutes: 120
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Verify native interpreter
        run: uv run python -c "import platform; assert platform.machine() == 'arm64'"
      - name: Validate release metadata
        run: uv run python packaging/check_release.py
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python packaging/check_release.py --tag "$RELEASE_TAG"
      - name: Build and audit native archive
        run: PYTHON=.venv/bin/python bash packaging/macos/build.sh
      - name: Upload macOS release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mdhelper-macos-arm64
          path: dist/macos/MDHelper-*-macOS-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
