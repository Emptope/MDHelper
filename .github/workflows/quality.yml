name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS arm64
            os: macos-14
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install Linux GUI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install locked GUI development environment
        run: uv sync --frozen --extra gui --group dev
      - name: Validate release metadata
        run: uv run python packaging/check_release.py
      - name: Repository checks
        run: uv run prek run --all-files
      - name: Test with workers
        if: runner.os == 'Linux'
        run: >-
          uv run --extra gui pytest -q -n 4 --dist worksteal
          --cov=mdhelper --cov-report=term-missing:skip-covered
      - name: Test serially
        if: runner.os != 'Linux'
        run: >-
          uv run --extra gui pytest -q
          --cov=mdhelper --cov-report=term-missing:skip-covered
      - name: Build and smoke test Linux archives
        if: runner.os == 'Linux'
        run: >-
          PYTHON=.venv/bin/python SMOKE_REQUEST=packaging/smoke/request.json
          bash packaging/posix/build.sh linux
      - name: Build and smoke test macOS DMG
        if: runner.os == 'macOS'
        run: >-
          PYTHON=.venv/bin/python SMOKE_REQUEST=packaging/smoke/request.json
          bash packaging/posix/build.sh macos
      - name: Build and smoke test Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\packaging\windows\build.ps1 `
            -Python ".venv\Scripts\python.exe" `
            -SmokeRequest "packaging\smoke\request.json"
      - name: Verify headless Linux CLI
        if: runner.os == 'Linux'
        run: |
          uv sync --frozen --group dev
          version=$(uv run python packaging/check_release.py)
          wheel="dist/mdhelper-${version}-py3-none-any.whl"
          uv run python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
          env -u DISPLAY uv run mdhelper --version
          env -u DISPLAY uv run mdhelper tui --smoke-test
          uv run python packaging/clean_build.py
          uv build
          uv run python packaging/verify_wheel.py "$wheel"
          uv run python packaging/generate_notices.py \
            --output build/license-audit/THIRD_PARTY_NOTICES.json
          wheel_env="${RUNNER_TEMP}/mdhelper-wheel"
          uv venv --python 3.12 "$wheel_env"
          uv pip install --python "$wheel_env/bin/python" "$wheel"
          "$wheel_env/bin/mdhelper" --version
          "$wheel_env/bin/mdhelper" cli --help
      - name: Verify macOS native startup
        if: runner.os == 'macOS'
        run: |
          uv run python -c "import platform; assert platform.machine() == 'arm64'"
          uv run mdhelper --version
          uv run mdhelper cli --help
          uv run mdhelper tui --smoke-test
          QT_QPA_PLATFORM=offscreen uv run mdhelper gui --smoke-test
          QT_QPA_PLATFORM=cocoa uv run mdhelper gui --smoke-test
          uv run python packaging/clean_build.py
          uv build
          version=$(uv run python packaging/check_release.py)
          wheel="dist/mdhelper-${version}-py3-none-any.whl"
          uv run python packaging/verify_wheel.py "$wheel"
          wheel_env="${RUNNER_TEMP}/mdhelper-wheel"
          uv venv --python 3.12 "$wheel_env"
          uv pip install --python "$wheel_env/bin/python" "$wheel"
          "$wheel_env/bin/mdhelper" --version
          "$wheel_env/bin/mdhelper" cli --help
          "$wheel_env/bin/mdhelper" tui --smoke-test
          QT_QPA_PLATFORM=offscreen "$wheel_env/bin/mdhelper" gui --smoke-test
          QT_QPA_PLATFORM=cocoa "$wheel_env/bin/mdhelper" gui --smoke-test
      - name: Verify Windows GUI startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          uv run mdhelper gui --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke test failed." }
      - name: Upload Linux wheel
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mdhelper-python-wheel-ci
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
