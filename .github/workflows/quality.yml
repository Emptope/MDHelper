name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.12.6
          uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check conftest.py packaging src tests
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q
      - name: Verify headless Linux CLI
        if: runner.os == 'Linux'
        run: |
          uv run python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
          env -u DISPLAY uv run mdhelper --version
          env -u DISPLAY uv run mdhelper tui --smoke-test
          uv build --wheel
          uv run python packaging/verify_wheel.py dist/mdhelper-0.1.0-py3-none-any.whl
          uv run python packaging/generate_notices.py --output dist/THIRD_PARTY_NOTICES.json
      - name: Verify Windows GUI startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          uv run mdhelper gui --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke test failed." }
      - name: Upload Linux wheel
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mdhelper-linux-wheel
          path: |
            dist/*.whl
            dist/THIRD_PARTY_NOTICES.json
          if-no-files-found: error
