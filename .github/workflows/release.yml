name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate release tag
        run: python packaging/check_release.py --tag "${{ github.ref_name }}"

  linux:
    needs: validate
    uses: ./.github/workflows/linux-release.yml

  windows:
    needs: validate
    uses: ./.github/workflows/windows-release.yml

  publish:
    needs:
      - linux
      - windows
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download validated artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mdhelper-*
          path: release-dist
          merge-multiple: true
      - name: Verify artifacts and create checksums
        run: |
          version=$(python packaging/check_release.py --tag "$GITHUB_REF_NAME")
          test -f "release-dist/mdhelper-${version}-py3-none-any.whl"
          test -f "release-dist/MDHelper-${version}-Linux-x86_64.tar.gz"
          test -f "release-dist/MDHelper-${version}-Linux-x86_64-GUI.tar.gz"
          test -f "release-dist/MDHelper-${version}-Windows-x64.zip"
          test -f "release-dist/THIRD_PARTY_NOTICES.json"
          cd release-dist
          sha256sum -- \
            "mdhelper-${version}-py3-none-any.whl" \
            "MDHelper-${version}-Linux-x86_64.tar.gz" \
            "MDHelper-${version}-Linux-x86_64-GUI.tar.gz" \
            "MDHelper-${version}-Windows-x64.zip" \
            "THIRD_PARTY_NOTICES.json" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python packaging/check_release.py --tag "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" \
            "release-dist/mdhelper-${version}-py3-none-any.whl" \
            "release-dist/MDHelper-${version}-Linux-x86_64.tar.gz" \
            "release-dist/MDHelper-${version}-Linux-x86_64-GUI.tar.gz" \
            "release-dist/MDHelper-${version}-Windows-x64.zip" \
            "release-dist/THIRD_PARTY_NOTICES.json" \
            "release-dist/SHA256SUMS" \
            --generate-notes \
            --title "MDHelper ${version}" \
            --verify-tag
