name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/check_release.py --tag "$RELEASE_TAG"

  linux:
    needs: validate
    uses: $/.github/workflows/linux-release.yml

  windows:
    needs: validate
    uses: $/.github/workflows/windows-release.yml

  publish:
    needs:
      - linux
      - windows
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download validated artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mdhelper-*
          path: release-dist
          merge-multiple: true
      - name: Verify artifacts and create checksums
        run: |
          version=$(python packaging/check_release.py --tag "$GITHUB_REF_NAME")
          test -f "release-dist/mdhelper-${version}-py3-none-any.whl"
          test -f "release-dist/MDHelper-${version}-Linux-x86_64.tar.gz"
          test -f "release-dist/MDHelper-${version}-Linux-x86_64-GUI.tar.gz"
          test -f "release-dist/MDHelper-${version}-Windows-x64.zip"
          cd release-dist
          sha256sum -- \
            "mdhelper-${version}-py3-none-any.whl" \
            "MDHelper-${version}-Linux-x86_64.tar.gz" \
            "MDHelper-${version}-Linux-x86_64-GUI.tar.gz" \
            "MDHelper-${version}-Windows-x64.zip" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python packaging/check_release.py --tag "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" \
            "release-dist/mdhelper-${version}-py3-none-any.whl" \
            "release-dist/MDHelper-${version}-Linux-x86_64.tar.gz" \
            "release-dist/MDHelper-${version}-Linux-x86_64-GUI.tar.gz" \
            "release-dist/MDHelper-${version}-Windows-x64.zip" \
            "release-dist/SHA256SUMS" \
            --generate-notes \
            --title "MDHelper ${version}" \
            --verify-tag
