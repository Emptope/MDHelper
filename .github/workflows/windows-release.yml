name: Windows release candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    timeout-minutes: 120
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Validate release metadata
        run: uv run python packaging/check_release.py
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python packaging/check_release.py --tag "$env:RELEASE_TAG"
      - name: Build and audit Windows archive
        shell: pwsh
        run: |
          .\packaging\windows\build.ps1 `
            -Python ".venv\Scripts\python.exe"
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mdhelper-windows-x64
          path: dist/windows/MDHelper-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
