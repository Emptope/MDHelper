name: Windows release candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    timeout-minutes: 120
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Validate release metadata
        run: uv run python packaging/check_release.py
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run python packaging/check_release.py --tag "${{ github.ref_name }}"
      - name: Validate source
        run: |
          uv run ruff check conftest.py packaging src tests
          uv run mypy src packaging/check_release.py
          uv run pytest -q
      - name: Build and validate Windows archive
        shell: pwsh
        run: |
          .\packaging\windows\build.ps1 `
            -Python ".venv\Scripts\python.exe"
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mdhelper-windows-x64
          path: dist/windows/MDHelper-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
