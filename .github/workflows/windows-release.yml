name: Windows release candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    timeout-minutes: 120
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Validate release metadata
        run: uv run python packaging/check_release.py
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run python packaging/check_release.py --tag "${{ github.ref_name }}"
      - name: Validate source
        run: |
          uv run ruff check conftest.py packaging src tests
          uv run mypy src packaging/check_release.py
          uv run pytest -q
      - name: Build and validate Windows archive
        shell: pwsh
        run: |
          .\packaging\windows\build.ps1 `
            -Python ".venv\Scripts\python.exe"
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mdhelper-windows-x64
          path: dist/windows/MDHelper-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
